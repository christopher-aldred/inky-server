<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sheffield Weather Forecast</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #2a2a2a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        img {
            max-width: 100%;
            height: auto;
            margin-top: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .container {
            max-width: 800px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <img id="weather-image" src="/api/weather-image" alt="Sheffield Weather Forecast">
    </div>
    <script>
        // Refresh the image every 5 minutes
        setInterval(() => {
            const img = document.getElementById('weather-image');
            img.src = `/api/weather-image?t=${Date.now()}`;
        }, 5 * 60 * 1000);
    </script>
</body>
</html>
